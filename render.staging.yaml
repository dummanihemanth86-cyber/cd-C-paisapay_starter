previews:
  generation: off

projects:
  - name: PaisaPay Admin Staging
    environments:
      - name: Staging
        networking:
          isolation: enabled
        services:
          - type: web
            name: paisapay-api-staging
            runtime: node
            repo: https://github.com/dummanihemanth86-cyber/cd-C-paisapay_starter.git
            branch: codex/admin-wallet-credit-staging
            plan: free
            region: oregon
            rootDir: server
            buildCommand: npm ci --include=dev && npm run db && npm run build
            startCommand: npm start
            healthCheckPath: /ready
            autoDeployTrigger: 'off'
            envVars:
              - key: NODE_VERSION
                value: 22.22.2
              - key: NODE_ENV
                value: production
              - key: HOST
                value: 0.0.0.0
              - key: APP_ORIGIN
                value: ''
              - key: DATABASE_URL
                fromDatabase:
                  name: paisapay-admin-staging-db
                  property: connectionString
              - key: SESSION_HASH_SECRET
                generateValue: true
              - key: BANK_ACCOUNT_ENCRYPTION_KEY
                sync: false
              - key: OTP_PROVIDER
                value: renflair-v1
              - key: RENFLAIR_API_KEY
                sync: false
              - key: PAYMENT_PROVIDER
                value: disabled
              - key: FINANCIAL_OPERATIONS_ENABLED
                value: 'false'
              - key: MANUAL_UPI_OPERATIONS_ENABLED
                value: 'false'
              - key: MANUAL_UPI_PRODUCTION_APPROVED
                value: 'false'
              - key: WALLET_ADJUSTMENTS_ENABLED
                value: 'false'
              - key: ADMIN_WALLET_FUNDING_ENABLED
                value: 'false'
              - key: ADMIN_WALLET_CREDITS_ENABLED
                value: 'false'
              - key: ADMIN_WALLET_PRODUCTION_APPROVED
                value: 'false'
              - key: ADMIN_WALLET_EXTERNAL_RECONCILIATION_VERIFIED
                value: 'false'
              - key: WELCOME_BONUS_ENABLED
                value: 'false'
              - key: UPI_DEPOSIT_REWARD_ENABLED
                value: 'false'
