services:
  - type: web
    name: paisapay-api
    runtime: node
    plan: starter
    region: singapore
    rootDir: server
    buildCommand: npm ci --include=dev && npm run build
    preDeployCommand: npm run db:deploy
    startCommand: npm start
    healthCheckPath: /ready
    envVars:
      - key: NODE_VERSION
        value: 22.22.2
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_DATABASE_URL
        sync: false
      - key: SESSION_HASH_SECRET
        sync: false
      - key: BANK_ACCOUNT_ENCRYPTION_KEY
        sync: false
      - key: OTP_PROVIDER
        value: renflair-v1
      - key: RENFLAIR_API_KEY
        sync: false
      - key: PAYMENT_PROVIDER
        value: disabled
      - key: FINANCIAL_OPERATIONS_ENABLED
        value: "false"
      - key: WALLET_ADJUSTMENTS_ENABLED
        value: "false"
      - key: ADMIN_WALLET_FUNDING_ENABLED
        value: "false"
      - key: ADMIN_WALLET_CREDITS_ENABLED
        value: "false"
      - key: ADMIN_WALLET_PRODUCTION_APPROVED
        value: "false"
      - key: ADMIN_WALLET_EXTERNAL_RECONCILIATION_VERIFIED
        value: "false"
      - key: DEPOSIT_RECEIVER_UPI_ID
        sync: false
      - key: UPI_DEPOSIT_REWARD_ENABLED
        value: "false"
      - key: WELCOME_BONUS_ENABLED
        value: "false"
